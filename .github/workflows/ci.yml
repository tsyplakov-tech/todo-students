name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime / Node 24
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: todo-students-runtime
      cancel-in-progress: false
    env:
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          npm run prisma:validate
          npm run build
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        shell: bash
        run: |
          docker compose --env-file .env.example config --quiet
          docker build --target runtime --tag todo-students:ci .

      - name: Verify application and PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          MOODLE_LOGIN: ${{ secrets.MOODLE_LOGIN }}
          MOODLE_FULL_NAME: ${{ secrets.MOODLE_FULL_NAME }}
          HOST: ${{ vars.HOST || '127.0.0.1' }}
          PORT: ${{ vars.PORT || '3000' }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
        run: bash .github/scripts/check-runtime.sh todo-students:ci

      - uses: actions/upload-artifact@v4
        with:
          name: todo-students-node-24
          path: dist/
          if-no-files-found: error
          retention-days: 7
